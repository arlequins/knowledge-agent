name: AWS sandbox smoke

on:
  workflow_dispatch:
    inputs:
      function_url:
        description: Optional Function URL override
        required: false
        type: string
      gateway_url:
        description: Optional API Gateway URL override
        required: false
        type: string
  schedule:
    - cron: "31 4 * * 2"

concurrency:
  group: aws-sandbox-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    environment: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      function_url: ${{ steps.endpoints.outputs.function_url }}
      gateway_url: ${{ steps.endpoints.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate sandbox endpoints
        id: endpoints
        env:
          AWS_SMOKE_FUNCTION_URL: ${{ inputs.function_url || vars.AWS_SMOKE_FUNCTION_URL }}
          AWS_SMOKE_GATEWAY_URL: ${{ inputs.gateway_url || vars.AWS_SMOKE_GATEWAY_URL }}
        run: node scripts/validate-aws-smoke-config.mjs

  smoke:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        preset: [function-url, api-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Select validated sandbox URL
        id: endpoint
        env:
          FUNCTION_URL: ${{ needs.preflight.outputs.function_url }}
          GATEWAY_URL: ${{ needs.preflight.outputs.gateway_url }}
        run: |
          if [ "${{ matrix.preset }}" = "function-url" ]; then
            URL="$FUNCTION_URL"
          else
            URL="$GATEWAY_URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: node scripts/smoke-api.mjs "${{ steps.endpoint.outputs.url }}"
