name: Publish tagged release

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tooling/github/setup
      - name: Copy environment template
        run: cp .env.example .env
      - name: Verify semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Verify release candidate
        run: pnpm check && pnpm typecheck && pnpm test && pnpm build && pnpm test:sst
      - name: Create GitHub Release when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
