name: Feature request
description: Propose a focused capability or architecture change.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful outcome and affected product surface.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Standalone chat
        - Embedded widget
        - MCP server
        - T3 analyzer
        - Legacy analyzer
        - Live data tools
        - Retrieval and evaluation
        - Infrastructure
    validations:
      required: true
