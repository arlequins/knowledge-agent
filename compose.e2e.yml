services:
  postgres-e2e:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app_e2e
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
